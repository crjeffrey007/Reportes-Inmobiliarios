<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceso - Reporte de Inquilinos</title>

<style>

body{
    margin:0;
    background:#f2f4f8;
    font-family:Arial;
}

.caja{
    width:350px;
    background:white;
    padding:30px;
    margin:80px auto;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#1a73e8;
    color:white;
    margin-top:15px;
    cursor:pointer;
}

button:hover{
    background:#125cc3;
}

.error{
    color:red;
    text-align:center;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="caja">

    <h2>Acceso privado</h2>

    <input id="email" placeholder="Correo">

    <input id="password" type="password" placeholder="Contraseña">

    <button onclick="login()">
        Entrar
    </button>

    <div class="error" id="mensaje"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/TU_ID/exec";

async function login(){

    let email =
        document.getElementById("email").value;

    let password =
        document.getElementById("password").value;

    const respuesta =
        await fetch(API_URL,{
            method:"POST",
            body:JSON.stringify({
                accion:"login",
                email:email,
                password:password
            })
        });

    const data = await respuesta.json();

    if(data.ok){

        localStorage.setItem(
            "token",
            data.token
        );

        localStorage.setItem(
            "usuario",
            JSON.stringify(data.usuario)
        );

        window.location =
            "buscador.html";
    }
    else{
        document.getElementById("mensaje")
            .innerText = data.mensaje;
    }
}

</script>

</body>
</html>
