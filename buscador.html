<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Buscador Privado</title>

<style>

body{
    margin:0;
    background:#f4f4f4;
    font-family:Arial;
}

.top{
    background:#1a73e8;
    color:white;
    padding:15px;
}

.contenedor{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    margin-top:10px;
    padding:12px;
    border:none;
    background:#1a73e8;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.card{
    background:white;
    margin-top:20px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

</style>
</head>

<body>

<div class="top">
    Buscador Privado
</div>

<div class="contenedor">

    <input
        id="buscar"
        placeholder="Nombre, documento, apodo..."
    >

    <button onclick="buscar()">
        Buscar
    </button>

    <button onclick="salir()">
        Cerrar sesión
    </button>

    <div id="resultados"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/TU_ID/exec";

const token =
    localStorage.getItem("token");

if(!token){
    window.location="login.html";
}

async function buscar(){

    const termino =
        document.getElementById("buscar").value;

    const respuesta =
        await fetch(API_URL,{
            method:"POST",
            body:JSON.stringify({
                accion:"buscar",
                token:token,
                termino:termino
            })
        });

    const data = await respuesta.json();

    if(!data.ok){

        alert(data.mensaje);

        localStorage.clear();

        window.location="login.html";

        return;
    }

    let html="";

    data.resultados.forEach(function(r){

        html += `
        <div class="card">

            <b>${r.nombre}</b><br><br>

            Documento:
            ${r.documento}<br>

            Zona:
            ${r.zona}<br>

            Motivo:
            ${r.motivo}<br>

            Estado:
            ${r.estado}<br><br>

            ${r.detalles}

        </div>
        `;
    });

    document.getElementById("resultados")
        .innerHTML = html;
}

function salir(){

    localStorage.clear();

    window.location="login.html";
}

</script>

</body>
</html>
